services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crashclub
      POSTGRES_PASSWORD: crashclub_dev
      POSTGRES_DB: crashclub
    ports:
      - "5432:5432"
    volumes:
      - crash-club-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crashclub -d crashclub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crash-club-postgres:
